name: Build SKY STRIKE 3D EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name sky_strike_3d sky_strike_3d.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SKY-STRIKE-3D-WINDOWS
          path: dist/sky_strike_3d.exe
